name: Next.js build check

on:
  push:
    branches:
      - main
      - chapter4-accuracy-assessment
      - revamp/home-subject-navigation
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate chapter content and UI invariants
        run: npm run qa:content
      - name: Build production app
        run: npm run build
